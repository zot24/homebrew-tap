name: Bump screenforge
# Checks mehfuzh/screenforge for a newer release every 6 hours (or on demand from the Actions
# tab) and points Casks/screenforge.rb at it: version plus the DMG and Linux tar.gz checksums,
# read from the digests GitHub records for release assets. A release whose Linux files are not
# attached yet is picked up on the next run.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Casks/screenforge.rb
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: mehfuzh/screenforge
          CASK: Casks/screenforge.rb
        run: |
          set -euo pipefail
          CUR=$(sed -nE 's/^  version "(.*)"/\1/p' "$CASK")
          NEW=$(gh release view -R "$REPO" --json tagName -q .tagName); NEW=${NEW#v}
          if [ "$NEW" = "$CUR" ]; then echo "screenforge $CUR is current"; exit 0; fi
          ASSETS=$(gh release view "v$NEW" -R "$REPO" --json assets)
          sha() { jq -r --arg n "$1" '.assets[] | select(.name == $n) | .digest // "" | ltrimstr("sha256:")' <<<"$ASSETS"; }
          MAC=$(sha "ScreenForge-$NEW.dmg")
          LINUX=$(sha "ScreenForge-$NEW-linux-x86_64.tar.gz")
          if ! [[ "$MAC" =~ ^[0-9a-f]{64}$ && "$LINUX" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::notice::v$NEW does not have both the DMG and the Linux tar.gz yet; trying again next run"
            exit 0
          fi
          perl -pi -e "s/^  version \".*\"/  version \"$NEW\"/; s/(arm: +)\"[0-9a-f]{64}\"/\${1}\"$MAC\"/; s/(x86_64_linux: +)\"[0-9a-f]{64}\"/\${1}\"$LINUX\"/" "$CASK"
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "screenforge $NEW"
          git push
